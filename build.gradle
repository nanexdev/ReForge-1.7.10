buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

import static net.minecraftforge.gradle.dev.ForgeDevPlugin.*

configurations {
    deployJars
}


apply plugin: 'maven'
apply plugin: 'forgedev'

repositories {
    mavenLocal()
    flatDir {
        name "fileRepo"
        dirs "repo"
    }
}

minecraft {
    version = '1.7.10'
    mcpVersion = '9.05'
    fmlDir = projectDir.getAbsolutePath() + "/fml";
    mainClass = 'cpw.mods.fml.relauncher.ServerLaunchWrapper'
    tweakClass = 'cpw.mods.fml.common.launcher.FMLTweaker'
    installerVersion = "1.4"
}

// Fix dead Mojang S3 download URLs - redirect to current Mojang CDN
project.afterEvaluate {
    def mcCacheDir = new File(gradle.gradleUserHomeDir, 'caches/minecraft/net/minecraft')
    
    tasks.findByName('downloadClient')?.with {
        actions.clear()
        doLast {
            def dest = new File(mcCacheDir, "minecraft/1.7.10/minecraft-1.7.10.jar")
            if (!dest.exists() || dest.length() == 0) {
                dest.parentFile.mkdirs()
                new URL("https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar").withInputStream { is ->
                    dest.withOutputStream { os -> os << is }
                }
                logger.lifecycle("Downloaded MC 1.7.10 client jar (${dest.length()} bytes)")
            }
        }
    }
    
    tasks.findByName('downloadServer')?.with {
        actions.clear()
        doLast {
            def dest = new File(mcCacheDir, "minecraft_server/1.7.10/minecraft_server-1.7.10.jar")
            if (!dest.exists() || dest.length() == 0) {
                dest.parentFile.mkdirs()
                new URL("https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar").withInputStream { is ->
                    dest.withOutputStream { os -> os << is }
                }
                logger.lifecycle("Downloaded MC 1.7.10 server jar (${dest.length()} bytes)")
            }
        }
    }
    
    tasks.findByName('updateJson')?.with {
        actions.clear()
        doLast {
            def dest = new File(mcCacheDir, "minecraft_json/1.7.10/1.7.10.json")
            if (!dest.exists() || dest.length() == 0) {
                dest.parentFile.mkdirs()
                new URL("https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json").withInputStream { is ->
                    dest.withOutputStream { os -> os << is }
                }
                logger.lifecycle("Downloaded MC 1.7.10 version JSON (${dest.length()} bytes)")
            }
        }
    }

    // Fix dead HTTP installer URL - redirect to HTTPS Forge maven
    tasks.findByName('downloadBaseInstaller')?.with {
        actions.clear()
        doLast {
            def dest = new File(project.buildDir, "tmp/installer_base.1.4.jar")
            if (!dest.exists() || dest.length() < 100) {
                dest.parentFile.mkdirs()
                new URL("https://maven.minecraftforge.net/net/minecraftforge/installer/1.4/installer-1.4-shrunk.jar").withInputStream { is ->
                    dest.withOutputStream { os -> os << is }
                }
                logger.lifecycle("Downloaded installer_base.1.4.jar (${dest.length()} bytes)")
            }
        }
    }

    // Replace generateInstallJson: do token substitution without contacting dead CI server
    tasks.findByName('generateInstallJson')?.with {
        actions.clear()
        doLast {
            def mcVer    = project.minecraft.version
            def forgeVer = project.version
            def ts       = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ssZ").format(new Date())
            def tokens   = [
                '@minecraft_version@' : mcVer,
                '@project@'           : 'Forge',
                '@version@'           : forgeVer,
                '@artifact@'          : "net.minecraftforge:forge:${mcVer}-${forgeVer}",
                '@universal_jar@'     : "forge-${mcVer}-${forgeVer}-universal.jar",
                '@timestamp@'         : ts,
            ]
            def src  = file('fml/jsons/1.7.10-rel.json')
            def out  = new File(project.buildDir, 'tmp/install_profile.json')
            out.parentFile.mkdirs()
            def text = src.text
            tokens.each { k, v -> text = text.replace(k, v) }
            out.text = text
            logger.lifecycle "Generated install_profile.json"
        }
    }

    // Bypass dead CI server in createChangelog (ChangelogTask)
    tasks.findByName('createChangelog')?.with {
        actions.clear()
        doLast { /* no-op: ci.jenkins.minecraftforge.net is dead */ }
    }

    // Ensure installer_base is valid before packageInstaller expands it
    tasks.findByName('packageInstaller')?.doFirst {
        def installerBase = new File(project.buildDir, "tmp/installer_base.1.4.jar")
        if (!installerBase.exists() || installerBase.length() < 100) {
            installerBase.parentFile.mkdirs()
            new URL("https://maven.minecraftforge.net/net/minecraftforge/installer/1.4/installer-1.4-shrunk.jar").withInputStream { is ->
                installerBase.withOutputStream { os -> os << is }
            }
            logger.lifecycle("Re-downloaded installer_base.1.4.jar (${installerBase.length()} bytes)")
        }
    }
}

group = 'net.minecraftforge'
version = getVersionFromJava(getProject(), 'src/main/java/net/minecraftforge/common/ForgeVersion.java')

jenkins {
    job = 'minecraftforge'
}

// crowdin stuff
if (project.hasProperty("crowdinKey"))
    tasks.getLocalizations.apiKey = project.crowdinKey


launch4j {
    jreMinVersion = '1.6.0'
}

uploadArchives {
    repositories {
        add getProject().repositories.mavenLocal()
    }
    repositories.mavenDeployer {
        configuration = configurations.deployJars

        if (project.hasProperty("filesmaven")) {
            logger.info('Publishing to files server')
            repository(url: project.filesmaven.url) {
                authentication(userName: project.filesmaven.username, privateKey: project.filesmaven.key)
            }
        } else {
            logger.info('Publishing to repo folder')
            repository(url: 'file://localhost/' + project.file('repo').getAbsolutePath())
        }

        pom {
            groupId = project.group
            version = project.version
            artifactId = project.archivesBaseName
        }
        pom.project {
            name project.archivesBaseName
            packaging 'jar'
            description 'Minecraft Forge API'
            url 'https://github.com/MinecraftForge/MinecraftForge'

            scm {
                url 'https://github.com/MinecraftForge/MinecraftForge'
                connection 'scm:git:git://github.com/MinecraftForge/MinecraftForge.git'
                developerConnection 'scm:git:git@github.com:MinecraftForge/MinecraftForge.git'
            }

            issueManagement {
                system 'github'
                url 'https://github.com/MinecraftForge/MinecraftForge/issues'
            }

            licenses {
                license {
                    name 'Forge Public License'
                    url 'https://raw.github.com/MinecraftForge/MinecraftForge/master/MinecraftForge-License.txt'
                    distribution 'repo'
                }
            }

            developers {
                developer {
                    id 'cpw'
                    name 'cpw'
                    roles { role 'developer' }
                }
                developer {
                    id 'LexManos'
                    name 'Lex Manos'
                    roles { role 'developer' }
                }
                developer {
                    id 'AbrarSyed'
                    name 'Abrar Syed'
                    roles { role 'contributor' }
                }
            }
        }
    }
}
